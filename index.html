<style>
/* Layout concept: a single-column crew console. Status and the one thing to do first,
   then evidence (your numbers against your own baseline). Demo controls dock at the bottom. */
:root {
  --bg: #edf0f3;
  --surface: #ffffff;
  --surface-2: #e3e8ed;
  --ink: #14202b;
  --ink-2: #4a5866;
  --line: #c8d0d8;
  --accent: #1b5e9b;
  --accent-ink: #ffffff;
  --ok: #1d7a4b;       --ok-bg: #dcefe3;
  --watch: #9a6200;    --watch-bg: #f6e8c8;
  --act: #b3261e;      --act-bg: #f6d8d4;
  --font-display: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --font-body: 'Barlow', 'Helvetica Neue', Arial, sans-serif;
  --font-data: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d141b; --surface: #15202a; --surface-2: #1d2b37; --ink: #e6edf3; --ink-2: #9aa9b8;
    --line: #2b3a47; --accent: #6fb1ea; --accent-ink: #0d141b;
    --ok: #52c58b; --ok-bg: #12301f; --watch: #e6b14d; --watch-bg: #35280d; --act: #ff8174; --act-bg: #3b1714;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d141b; --surface: #15202a; --surface-2: #1d2b37; --ink: #e6edf3; --ink-2: #9aa9b8;
  --line: #2b3a47; --accent: #6fb1ea; --accent-ink: #0d141b;
  --ok: #52c58b; --ok-bg: #12301f; --watch: #e6b14d; --watch-bg: #35280d; --act: #ff8174; --act-bg: #3b1714;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 250px;
}
.wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.label { font-family: var(--font-display); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; font-size: 13px; color: var(--ink-2); }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand b { font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: 0.14em; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 3px; background: var(--surface-2); color: var(--ink); white-space: nowrap; }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.watch { background: var(--watch-bg); color: var(--watch); }
.chip.act { background: var(--act-bg); color: var(--act); }
.chip.accent { background: var(--accent); color: var(--accent-ink); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs a { font-family: var(--font-display); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; font-size: 16px; text-decoration: none; color: var(--ink-2);
  padding: 8px 14px; border-bottom: 3px solid transparent; margin-bottom: -1px; display: inline-flex; gap: 8px; align-items: center; }
.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.badge { background: var(--act); color: #fff; border-radius: 9px; min-width: 18px; height: 18px; padding: 0 5px; display: inline-grid; place-items: center; font-size: 12px; letter-spacing: 0; }

/* panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.status { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; align-items: center; }
.status .ico { width: 56px; height: 56px; }
.status.ok { background: var(--ok-bg); border-color: transparent; color: var(--ok); }
.status.watch { background: var(--watch-bg); border-color: transparent; color: var(--watch); }
.status.act { background: var(--act-bg); border-color: transparent; color: var(--act); }
.status .word { font-family: var(--font-display); font-weight: 700; font-size: 44px; line-height: 1; text-transform: uppercase; letter-spacing: 0.04em; }
.status .sub { grid-column: 1 / -1; color: var(--ink); font-size: 16px; }
.ico { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ico.sm { width: 16px; height: 16px; }

.alert h3 { font-family: var(--font-display); font-weight: 600; font-size: 24px; line-height: 1.15; text-wrap: balance; }
.alert .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.alert p { max-width: 65ch; }
.note { background: var(--surface-2); border-radius: 4px; padding: 8px 10px; font-size: 14px; max-width: 65ch; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 8px 14px; font-weight: 500; min-height: 40px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.sm { min-height: 34px; padding: 4px 12px; font-size: 14px; }
.btn.quiet { border-color: transparent; background: transparent; text-decoration: underline; color: var(--ink-2); }

/* baseline table */
.tablewrap { overflow-x: auto; }
table.vs { width: 100%; border-collapse: collapse; }
.vs th, .vs td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); font-weight: 400; vertical-align: middle; }
.vs thead th { font-family: var(--font-display); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; font-size: 13px; color: var(--ink-2); }
.vs .n { text-align: right; white-space: nowrap; }
.vs tbody th { font-weight: 500; }
.vs tr:last-child th, .vs tr:last-child td { border-bottom: 0; }
.sig { display: inline-flex; align-items: center; gap: 8px; }
.pill { display: inline-block; min-width: 64px; text-align: center; padding: 2px 8px; border-radius: 3px; font-family: var(--font-data); font-size: 13px; background: var(--surface-2); }
.pill.watch { background: var(--watch-bg); color: var(--watch); }
.pill.act { background: var(--act-bg); color: var(--act); }
.foot { font-size: 13px; color: var(--ink-2); max-width: 70ch; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 24px; }
.facts div { display: flex; flex-direction: column; }
.facts b { font-family: var(--font-data); font-weight: 500; font-size: 18px; }

/* trends */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 14px; min-height: 36px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.trend { gap: 8px; }
.trend .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.trend .val { font-family: var(--font-data); font-size: 24px; font-weight: 500; line-height: 1.1; }
.trend .val small { font-size: 13px; color: var(--ink-2); margin-left: 4px; }
.trend svg { width: 100%; height: auto; display: block; }
.band { fill: var(--accent); fill-opacity: 0.14; }
.meanline { stroke: var(--accent); stroke-width: 1; stroke-dasharray: 4 3; fill: none; }
.axis { stroke: var(--line); stroke-width: 1; fill: none; }
.series { stroke: var(--ink); stroke-width: 1.75; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.dot { fill: var(--ink-2); }
.dot.watch { fill: var(--watch); }
.dot.act { fill: var(--act); }
.dot.end { stroke: var(--surface); stroke-width: 2; }
.ax { font-family: var(--font-data); font-size: 10px; fill: var(--ink-2); }

/* actions */
.acts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.acts li { display: flex; flex-direction: column; gap: 8px; padding: 12px 0; border-top: 1px solid var(--line); }
.acts li:first-child { border-top: 0; padding-top: 0; }
.acts .text { max-width: 65ch; }
.acts .btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.acts li.done .text { color: var(--ink-2); text-decoration: line-through; text-decoration-thickness: 1px; }
.reasons { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.empty { color: var(--ink-2); max-width: 60ch; }
.log { width: 100%; border-collapse: collapse; font-size: 14px; }
.log th, .log td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); font-weight: 400; vertical-align: top; }
.log thead th { font-family: var(--font-display); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; font-size: 13px; color: var(--ink-2); }
.queue { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.queue li { display: flex; gap: 10px; align-items: baseline; }

/* demo dock */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.dock .in { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.dock .hint { font-size: 14px; min-height: 20px; }
.dock .hint b { font-family: var(--font-display); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); margin-right: 8px; }
.dock .btns { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.dock .sp { flex: 1 1 8px; }
.dock .auto { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.dock .clock { flex: 1 1 180px; min-width: 0; display: flex; align-items: center; gap: 10px; }
.track { flex: 1; min-width: 40px; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.fill { height: 100%; width: 0; background: var(--accent); }
#clock { font-family: var(--font-data); font-size: 13px; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }

.about h2 { font-family: var(--font-display); font-weight: 600; font-size: 22px; line-height: 1.15; }
.about p, .refs li { max-width: 70ch; }
.refs { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; }
.about a, .legal a, .note a { color: var(--accent); text-underline-offset: 2px; overflow-wrap: anywhere; }
.facts .foot { margin-top: 2px; }
.legal { font-size: 13px; color: var(--ink-2); max-width: 75ch; }
@media (prefers-reduced-motion: no-preference) {
  .panel { transition: background-color .2s; }
  .fill { transition: width .2s linear; }
}
@media (max-width: 480px) {
  .tabs { overflow-x: auto; }
  .tabs { gap: 0; }
  .tabs a { padding: 8px 8px; font-size: 14px; letter-spacing: 0.04em; gap: 5px; }
  .status .word { font-size: 36px; }
  .status .ico { width: 44px; height: 44px; }
  .vs th, .vs td { padding: 8px 4px; }
  .alert h3 { font-size: 22px; }
}
@media (max-width: 380px) {
  .tabs a { padding: 8px 5px; font-size: 13px; letter-spacing: 0.02em; gap: 4px; }
}

<script>
/* Vigil engine: simulator, personal baselines, rules, actions.
   Pure functions, no DOM, no network. Runs in the page and in Node tests. */
(function (root) {
  'use strict';

  // NASA reference values used by the prototype (sources are listed on the About screen):
  //  careerLimit: NASA-STD-3001 Vol. 1 Rev B career effective dose limit, 600 mSv (NASA OCHMO-TB-020 Rev E, Dec 2022)
  //  issSleep: ISS crews averaged 6.5 h of sleep a night against 8.5 h scheduled; nights of 6 h or less went with
  //            slower reaction speed (Jones et al. 2022, Sleep 45(3), NASA Reaction Self Test study)
  var NASA = { careerLimit: 600, issSleep: 6.5, shortSleep: 6.0 };
  var DAY0 = 101;   // mission day of the first simulated day
  var HIST = 40;    // days of history generated at start

  // Rule thresholds: l = [z-score, minimum % change] for watch (l1) and act (l2).
  // bad = direction that counts as worse. win = days averaged (3 = recent 3-day mean, 1 = today).
  var METRICS = {
    sleep:    { label: 'Sleep',              unit: 'h',        dec: 1, bad: -1, domain: 'sleep',     win: 3, l1: [2.3, 8],  l2: [3.6, 14] },
    hrv:      { label: 'HRV',                unit: 'ms',       dec: 0, bad: -1, domain: 'cardio',    win: 3, l1: [2.3, 10], l2: [3.6, 18] },
    restHR:   { label: 'Resting heart rate', unit: 'bpm',      dec: 0, bad:  1, domain: 'cardio',    win: 3, l1: [2.3, 5],  l2: [3.6, 9]  },
    reaction: { label: 'Reaction time',      unit: 'ms',       dec: 0, bad:  1, domain: 'cognition', win: 3, l1: [2.3, 6],  l2: [3.6, 11] },
    mood:     { label: 'Mood',               unit: '/5',       dec: 1, bad: -1, domain: 'mood',      win: 3, l1: [2.3, 12], l2: [3.6, 22] },
    stress:   { label: 'Stress',             unit: '/5',       dec: 1, bad:  1, domain: 'mood',      win: 3, l1: [2.3, 15], l2: [3.6, 27] },
    co2:      { label: 'Cabin CO₂',     unit: 'ppm',      dec: 0, bad:  1, domain: 'habitat',   win: 1, l1: [4, 15],   l2: [8, 30]   },
    dose:     { label: 'Radiation dose',     unit: 'mSv/day',  dec: 2, bad:  1, domain: 'radiation', win: 1, l1: [6, 50],   l2: [20, 200] }
  };
  var ORDER = ['sleep', 'hrv', 'restHR', 'reaction', 'mood', 'stress', 'co2', 'dose'];

  var DOMAIN_LABEL = { sleep: 'Sleep', cardio: 'Heart signals', cognition: 'Reaction time', mood: 'Mood' };
  var DOMAIN_ORDER = ['sleep', 'cardio', 'cognition', 'mood'];

  var SINGLE_TITLE = {
    sleep: 'Sleep is below your normal',
    cardio: 'Heart signals are off your baseline',
    cognition: 'Reaction time is slower than your normal',
    mood: 'Mood and stress are off your baseline'
  };

  // ---------- helpers ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function gauss(r) {
    var u = 0, v = 0;
    while (!u) u = r();
    while (!v) v = r();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }
  function clamp(x, lo, hi) { return Math.max(lo, Math.min(hi, x)); }
  function mean(a) { var s = 0; for (var i = 0; i < a.length; i++) s += a[i]; return s / a.length; }
  function sd(a) {
    var m = mean(a), s = 0;
    for (var i = 0; i < a.length; i++) s += (a[i] - m) * (a[i] - m);
    return Math.sqrt(s / (a.length - 1));
  }
  function joinList(a) {
    if (a.length <= 1) return a.join('');
    return a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
  }

  function fmt(key, v) {
    var m = METRICS[key];
    if (key === 'co2') return Math.round(v).toLocaleString('en-US');
    return v.toFixed(m.dec);
  }
  function withUnit(key, v) {
    var m = METRICS[key];
    var n = fmt(key, v);
    return m.unit === '/5' ? n + '/5' : n + ' ' + m.unit;
  }

  // ---------- simulator ----------
  function createSim(seed) {
    var sim = {
      seed: seed,
      rng: mulberry32(seed),
      days: [],
      st: { debt: 0, disrupt: 0, co2Armed: false, co2Active: 0, co2Resid: 0, lastRise: 0, spikeArmed: false, cum: 55 }
    };
    for (var i = 0; i < HIST; i++) step(sim, []);
    return sim;
  }

  // Adds one day. fx = effects of actions completed the day before ('sleep', 'scrubber').
  function step(sim, fx) {
    var st = sim.st, g = function () { return gauss(sim.rng); };
    var has = function (k) { return fx.indexOf(k) >= 0; };
    var events = [];

    if (st.disrupt > 0) {
      st.debt = Math.min(3, st.debt + (st.disrupt === 3 ? 1.5 : 1));
      st.disrupt--;
      events.push('sleep-loss');
    } else {
      st.debt = Math.max(0, st.debt - (0.4 + (has('sleep') ? 0.9 : 0)));
    }

    var rise = 0;
    if (st.co2Armed || st.co2Active > 0) {
      if (has('scrubber') && st.co2Active > 0) {
        st.co2Resid = st.lastRise * 0.12;
        st.co2Active = 0; st.co2Armed = false; st.lastRise = 0;
      } else {
        st.co2Active = Math.min(6, st.co2Active + 1);
        st.co2Armed = false;
        rise = Math.min(2400, 900 * st.co2Active);
        st.lastRise = rise;
        events.push('co2-fault');
      }
    } else {
      st.co2Resid *= 0.3;
    }
    var f = rise / 2400;
    var d = st.debt;

    var dose = 0.55 + g() * 0.04;
    if (st.spikeArmed) { dose = 0.55 * 6 + g() * 0.1; st.spikeArmed = false; events.push('solar-storm'); }
    st.cum += dose;

    var headaches = 0;
    if (rise > 0) headaches = st.co2Active >= 2 ? 3 : 2;
    else for (var c = 0; c < 3; c++) if (sim.rng() < 0.02) headaches++;

    var rec = {
      i: sim.days.length,
      md: DAY0 + sim.days.length,
      sleep:    clamp(NASA.issSleep - 0.8 * d + g() * 0.35, 3, 10),
      restHR:   58 + 2 * d + 1.5 * f + g() * 1.6,
      hrv:      62 * (1 - 0.07 * d - 0.04 * f) + g() * 4,
      reaction: 285 * (1 + 0.06 * d + 0.08 * f) + g() * 12,
      mood:     clamp(3.8 - 0.35 * d - 0.4 * f + g() * 0.3, 1, 5),
      stress:   clamp(2.2 + 0.35 * d + 0.4 * f + g() * 0.3, 1, 5),
      co2:      2200 + rise + st.co2Resid + g() * 90,
      dose:     dose,
      headaches: headaches,
      cum:      st.cum,
      events:   events
    };
    sim.days.push(rec);
    rec.flag = analyze(sim.days, rec.i).level > 0;   // flagged days stay out of later baselines
    return rec;
  }

  function inject(sim, type) {
    var st = sim.st, did = false;
    if (type === 'sleep') { st.disrupt = 3; did = true; }
    if (type === 'co2' && st.co2Active === 0) { st.co2Armed = true; did = true; }
    if (type === 'solar') { st.spikeArmed = true; did = true; }
    if (did) { st.injected = (st.injected || 0) + 1; st.lastEvent = sim.days.length; }
  }

  // Random event scheduler for auto mode. rnd is Math.random or a seeded function.
  // Returns 'sleep', 'co2', 'solar' or null. Waits until nothing is running, no alert is live and
  // at least 12 days have passed since the last event, so each one can recover. The first event
  // is never later than day 2.
  var EVENT_P = 0.35, MIN_GAP = 12;
  function suggestEvent(sim, rnd, level) {
    var st = sim.st;
    if (activeEvents(sim).length || level > 0) return null;
    var first = !(st.injected > 0) && sim.days.length - HIST >= 1;
    if (!first) {
      if (st.injected > 0 && sim.days.length - st.lastEvent < MIN_GAP) return null;
      if (rnd() >= EVENT_P) return null;
    }
    var x = rnd();
    return x < 0.45 ? 'sleep' : x < 0.75 ? 'co2' : 'solar';
  }

  function activeEvents(sim) {
    var out = [], st = sim.st;
    if (st.disrupt > 0) out.push('sleep loss (' + st.disrupt + (st.disrupt === 1 ? ' night' : ' nights') + ' left)');
    if (st.co2Armed || st.co2Active > 0) out.push('CO₂ fault');
    if (st.spikeArmed) out.push('solar storm');
    return out;
  }

  // ---------- baselines and analysis ----------
  function median(a) {
    var b = a.slice().sort(function (x, y) { return x - y; }), n = b.length;

        metrics: [], improving: false,
        actions: [

        L('https://ntrs.nasa.gov/api/citations/20230001817/downloads/JSC-20584_Rev_B_FINAL_Update.pdf', 'JSC 20584 Rev B (November 2022)') + '.</li></ul>' +
      '<p class="foot">Vigil is not an official NASA product and uses no NASA logos or mission identifiers.</p></section>' +

      '<section class="panel about"><h2>Use of AI</h2>' +
      '<p>The code, the data simulator, the rule logic, the step wording and the design of this page were generated with Claude, an AI assistant made by Anthropic, working from the team\u2019s plan. All graphics are drawn by code. No AI-generated images, audio or video are used.</p>' +
      '<p>The step wording and the alert thresholds are placeholders. Flight surgeons would need to review them before any real use.</p></section>' +

      '<section class="panel about"><h2>Other resources</h2><ul class="refs">' +
      '<li>Fonts from Google Fonts, all under the SIL Open Font License: Barlow and Barlow Condensed (Jeremy Tribby), IBM Plex Mono (IBM).</li>' +
      '<li>No other libraries, images or third-party code. The page makes no network requests besides the fonts.</li></ul></section>';
  }

  function viewActions(a) {
    var h = '';
    if (!a.alerts.length) {
      h += '<section class="panel"><div class="label">Action list</div><p class="empty">Nothing to do today. When a signal moves off your baseline, the steps for it show up here.</p></section>';
    }
    a.alerts.forEach(function (al) {
      h += '<section class="panel"><div class="row" style="display:flex;flex-wrap:wrap;gap:6px;align-items:center"><span class="chip ' + levelName(al.level) + '">' + icon(al.level, 'sm') + LEVEL_CHIP[al.level] + '</span><span class="chip">' + KIND[al.kind] + '</span></div>' +
        '<h2 style="font-family:var(--font-display);font-weight:600;font-size:22px;line-height:1.15">' + esc(al.title) + '</h2><ul class="acts">';
      al.actions.forEach(function (x) { h += actionRow(al, x); });
      h += '</ul></section>';
    });

    h += '<section class="panel"><div class="label">Ground downlink queue</div>';
    if (queue.length) {
      h += '<ul class="queue">' + queue.map(function (q) { return '<li><span class="mono">MD ' + q.md + '</span><span>' + esc(q.title) + '</span></li>'; }).join('') + '</ul>' +
        '<div><button type="button" class="btn sm" data-a="send" data-k="send">Simulate link restored: send queue</button></div>';
    } else {
      h += '<p class="empty">Empty. Steps that ask you to add a summary to the downlink wait here until the next contact window.</p>';
    }
    h += '</section>';

    h += '<section class="panel"><div class="label">Decision log</div>';
    if (log.length) {
      h += '<div class="tablewrap"><table class="log"><thead><tr><th scope="col">Day</th><th scope="col">Step</th><th scope="col">You chose</th></tr></thead><tbody>' +
        log.map(function (e) { return '<tr><td class="mono">MD ' + e.md + '</td><td>' + esc(e.text) + '</td><td>' + (e.status === 'done' ? 'Done' : 'Ignored: ' + esc(e.reason)) + '</td></tr>'; }).join('') + '</tbody></table></div>';
    } else {
      h += '<p class="empty">Each day’s decisions are saved here when you move to the next day. Ignore reasons show which rules need tuning.</p>';
    }
    h += '</section>';
    h += '<p class="legal">Vigil gives awareness and action support. It does not diagnose. Step wording is demo text and needs review by flight surgeons before real use.</p>';
    return h;
  }

  // ---------- chrome ----------
  function render() {
    var a = A(), focus = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.k : null;
    var open = openCount(a);
    var app = '<header class="top"><div class="brand"><b>VIGIL</b><span class="label">Crew A · mission day ' + a.md + '</span></div>' +
      '<div class="meta"><span class="chip">Ground link offline</span><span class="chip' + (queue.length ? ' accent' : '') + '">Downlink queue ' + queue.length + '</span></div></header>';
    app += '<nav class="tabs" aria-label="Screens">' +
      ['today', 'trends', 'actions', 'about'].map(function (t) {
        return '<a href="#' + t + '" data-k="tab-' + t + '"' + (tab === t ? ' aria-current="page"' : '') + '>' + t +
          (t === 'actions' && open ? '<span class="badge" aria-label="' + open + ' open">' + open + '</span>' : '') + '</a>';
      }).join('') + '</nav>';
    app += tab === 'trends' ? viewTrends(a) : tab === 'actions' ? viewActions(a) : tab === 'about' ? viewAbout() : viewToday(a);
    app += '<p class="legal">All analysis runs in this page on simulated data. Nothing is sent anywhere. A real build would keep readings encrypted on the device and readable only by the crew member. The code and the simulated data were generated with AI (Claude). <a href="#about">Sources and AI disclosure</a></p>';
    document.getElementById('app').innerHTML = app;

    var ev = V.activeEvents(sim), hint;
    if (flash) hint = flash;
    else if (ev.length) hint = 'Event running: ' + ev.join(', ') + '. ' + (auto ? 'Watch the data over the next days.' : 'Press Next day to see it in the data.');
    else if (a.level > 0 && open > 0) hint = 'An alert is live. Open Actions and mark the steps done' + (auto ? ' before the day ends.' : ', then press Next day.');
    else if (a.level > 0) hint = 'Steps are logged. ' + (auto ? 'Watch whether the data recovers.' : 'Press Next day to see whether the data recovers.');
    else if (auto) hint = sim.days.length === 40 ? 'The first random event starts within two days.' : 'All clear. A random event can start on any day.';
    else hint = 'Auto is paused. Inject an event or press Next day.';
    document.getElementById('dock').innerHTML = '<p class="hint" role="status" aria-live="polite"><b>' + (auto ? 'Auto' : 'Paused') + '</b>' + esc(hint) + '</p>' +
      '<div class="auto"><button type="button" class="btn sm" data-a="auto" data-k="auto">' + (auto ? 'Pause' : 'Resume auto') + '</button>' +
      '<div class="seg" role="group" aria-label="Seconds per mission day">' +
      [4, 8, 16].map(function (n) { return '<button type="button" data-a="speed" data-n="' + n + '" data-k="s' + n + '" aria-pressed="' + (secs === n) + '">' + n + ' s/day</button>'; }).join('') + '</div>' +
      '<div class="clock"><div class="track" aria-hidden="true"><div class="fill" id="fill" style="width:' + ((1 - left / (secs * 1000)) * 100).toFixed(1) + '%"></div></div><span class="mono" id="clock"></span></div></div>' +
      '<div class="btns"><button type="button" class="btn sm" data-a="inject" data-type="sleep" data-k="e-sleep">Inject sleep loss</button>' +
      '<button type="button" class="btn sm" data-a="inject" data-type="co2" data-k="e-co2">Inject CO₂ fault</button>' +
      '<button type="button" class="btn sm" data-a="inject" data-type="solar" data-k="e-solar">Inject solar storm</button><span class="sp"></span>' +
      '<button type="button" class="btn quiet sm" data-a="reset" data-k="reset">Reset</button>' +
      '<button type="button" class="btn primary" data-a="next" data-k="next">Next day ▶</button></div>';
    paintClock();

    if (focus) { var el = document.querySelector('[data-k="' + focus + '"]'); if (el) el.focus(); }
  }

  // Countdown bar in the dock. Updated in place so the page is not redrawn every tick.
  function paintClock() {
    var f = document.getElementById('fill'), c = document.getElementById('clock');
    if (!f || !c) return;
    f.style.width = ((1 - left / (secs * 1000)) * 100).toFixed(1) + '%';
    c.textContent = !auto ? 'Auto paused' : pendingIgnore ? 'Waiting for your choice' : 'Next day in ' + Math.ceil(left / 1000) + ' s';
  }

  // Applies the day's decisions, in auto mode maybe starts a random event, then moves to the next day.
  function nextDay() {
    var a = A(), fx = [];
    allActions(a).forEach(function (x) {
      var r = responses[x.act.key];
      if (r) log.unshift({ md: a.md, text: x.act.text, status: r.status, reason: r.reason || '' });
      if (r && r.status === 'done' && x.act.effect !== 'none') fx.push(x.act.effect);
    });
    responses = {}; pendingIgnore = null; flash = '';
    if (auto) {
      var ev = V.suggestEvent(sim, Math.random, a.level);
      if (ev) { V.inject(sim, ev); flash = EVENT_NOTE[ev]; }
    }
    V.step(sim, fx);
    left = secs * 1000;
  }

  // Timer: counts down while auto is on, the tab is visible and no ignore reason is being chosen.
  setInterval(function () {
    var now = Date.now(), dt = now - lastTick;
    lastTick = now;
    if (!auto || document.hidden || pendingIgnore) { paintClock(); return; }
    left -= dt;
    if (left <= 0) { nextDay(); render(); return; }
    paintClock();
  }, 200);

  function findAction(a, key) { var f = allActions(a).filter(function (x) { return x.act.key === key; })[0]; return f; }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-a]');
    if (!b) return;
    var act = b.dataset.a, key = b.dataset.key, a = A(), hit;
    flash = '';
    if (act === 'done') {
      hit = findAction(a, key);
      responses[key] = { status: 'done' };
      if (hit && hit.act.downlink) queue.push({ key: key, md: a.md, title: hit.alert.title });
      pendingIgnore = null;
    } else if (act === 'ignore') { pendingIgnore = key; }
    else if (act === 'cancel') { pendingIgnore = null; }
    else if (act === 'reason') { responses[key] = { status: 'ignored', reason: REASONS[+b.dataset.why] }; pendingIgnore = null; }
    else if (act === 'undo') { delete responses[key]; queue = queue.filter(function (q) { return q.key !== key; }); }
    else if (act === 'send') { flash = queue.length + (queue.length === 1 ? ' item' : ' items') + ' sent to the ground team.'; queue = []; }
    else if (act === 'range') { range = +b.dataset.n; }
    else if (act === 'inject') {
      V.inject(sim, b.dataset.type);
      flash = 'Event queued. It shows in the next day’s data.';
    }
    else if (act === 'auto') { auto = !auto; left = secs * 1000; lastTick = Date.now(); }
    else if (act === 'speed') { secs = +b.dataset.n; left = secs * 1000; lastTick = Date.now(); }
    else if (act === 'reset') { reset(); }
    else if (act === 'next') { nextDay(); }
    render();
  });

  function route() {
    var t = (location.hash || '').replace('#', '');
    tab = (t === 'trends' || t === 'actions' || t === 'about') ? t : 'today';
    render();
  }
  window.addEventListener('hashchange', route);

  reset();
  route();
})();

</script>

</body></html>
